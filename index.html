<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐔 Какая ты курочка?</title>
    
    <!-- SVG Favicon (Красно-белые полосы) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e4002b'/%3E%3Crect x='20' width='20' height='100' fill='%23ffffff'/%3E%3Crect x='60' width='20' height='100' fill='%23ffffff'/%3E%3C/svg%3E">

    <!-- Подключаем библиотеку для QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* --- ШРИФТЫ --- */
        @font-face {
            font-family: 'CeraCondensed';
            src: url('CeraCondensedPro-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'CeraCondensed';
            src: url('CeraCondensedPro-Black.woff') format('woff');
            font-weight: 900;
            font-style: normal;
        }

        /* --- ОБЩИЕ СТИЛИ --- */
        :root {
            --bg: #ffffff;
            --accent: #e4002b;
            --text: #000000;
            --text-muted: #666666;
            --border: #e0e0e0;
        }

        body {
            font-family: 'CeraCondensed', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        h1, h2, h3 {
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            color: var(--accent);
            margin-top: 0;
            text-align: center;
        }

        h1 { font-size: 32px; text-transform: uppercase; margin-bottom: 30px; }
        h2 { font-size: 24px; margin-bottom: 20px; }
        
        .hidden { display: none !important; }

        /* --- QR КОД (В ПРАВОМ НИЖНЕМ УГЛУ) --- */
        .qr-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-container p {
            margin: 0 0 8px 0;
            font-size: 12px;
            font-weight: 900;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .qr-container {
                transform: scale(0.8);
                transform-origin: bottom right;
                bottom: 10px;
                right: 10px;
            }
        }

        /* --- КНОПКИ --- */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 20px;
        }

        .btn:hover:not(:disabled) { opacity: 0.9; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }

        .toggle-mode {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .toggle-mode:hover { color: var(--accent); }

        /* --- ЭКРАН СЛУШАТЕЛЯ --- */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, background-color 0.2s;
            font-size: 21px;
            line-height: 1.4;
        }

        .checkbox-label:hover { border-color: var(--accent); }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .custom-checkbox {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid var(--border);
            border-radius: 4px;
            position: relative;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .checkbox-label input:checked ~ .custom-checkbox {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .custom-checkbox::after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-label input:checked ~ .custom-checkbox::after {
            display: block;
        }
        
        .checkbox-label:has(input:checked) {
            border-color: var(--accent);
            background-color: #fdf2f4;
        }

        /* --- ЭКРАН СПИКЕРА (ГРАФИКИ) --- */
        .score-display {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border: 2px solid var(--text);
            border-radius: 12px;
        }

        .score-title { font-size: 16px; color: var(--text-muted); margin-bottom: 10px; }
        .score-value {
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: var(--accent);
            line-height: 1;
        }
        .score-max { font-size: 24px; color: var(--text); }

        .chart-row { margin-bottom: 25px; }
        
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        
        .chart-label-text { padding-right: 15px; }
        .chart-label-value { font-weight: 900; white-space: nowrap; }

        .chart-track {
            background-color: var(--border);
            width: 100%;
            height: 28px;
            border-radius: 4px;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            background-color: #000;
        }

        .chart-row:nth-child(even) .chart-bar { background-color: var(--accent); }
        .chart-row:nth-child(odd) .chart-bar { background-color: #000; }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .status-msg.error { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<!-- Блок с QR-кодом -->
<div class="qr-container">
    <p>Сканируй</p>
    <div id="qrcode"></div>
</div>

<div class="container">
    
    <!-- ЭКРАН СЛУШАТЕЛЯ -->
    <div id="voter-screen">
        <h1>🐔 Какая ты курочка?</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">
            Отметь все утверждения, с которыми ты согласен(на)
        </p>

        <div class="question-list" id="questions-container">
            <!-- Вопросы генерируются через JS -->
        </div>

        <button class="btn" id="submit-btn" onclick="submitVote()">Узнать результат</button>
        <div id="vote-status" class="status-msg"></div>
    </div>

    <!-- ЭКРАН СПИКЕРА -->
    <div id="speaker-screen" class="hidden">
        <h2 style="text-align: center; margin-bottom: 30px;">Статистика выгорания</h2>
        
        <div class="score-display">
            <div class="score-title">Средний уровень "готовности курочки" 🐔</div>
            <div class="score-value"><span id="avg-score">0.0</span><span class="score-max"> / 6</span></div>
            <div class="score-title" style="margin-top: 15px; margin-bottom: 0;">Всего участников: <span id="total-voters" style="color: var(--text); font-weight: 900;">0</span></div>
        </div>

        <div id="charts-container">
            <!-- Графики генерируются через JS -->
        </div>

        <div id="speaker-status" class="status-msg"></div>
        
        <div class="toggle-mode" onclick="toggleMode()">Переключить в режим слушателя</div>
    </div>

    <div id="voter-toggle" class="toggle-mode" onclick="toggleMode()">Режим докладчика</div>

</div>

<script>
    // --- КОНФИГУРАЦИЯ ABACUS ---
    const ABACUS_BASE = "https://abacus.jasoncameron.dev";
    const NAMESPACE = "chicken_burnout_survey_2026"; // Ваше пространство имен
    const VOTE_STORAGE_KEY = "poll_vote_chicken_" + NAMESPACE;
    const POLL_INTERVAL_MS = 3000;

    const QUESTIONS = [
        "Я просыпаюсь уже уставшим(ей), даже после выходных.",
        "Рабочие задачи вызывают больше раздражения или отвращения, чем раньше.",
        "Мне сложнее сосредоточиться, помнить детали и принимать решения.",
        "Я всё чаще думаю, что моя работа бессмысленна или я не справляюсь.",
        "После работы почти не остаётся сил на жизнь вне работы.",
        "Отдых помогает ненадолго или совсем не помогает."
    ];

    let pollInterval = null;
    let currentMode = "voter";

    // --- ИНИЦИАЛИЗАЦИЯ UI ---
    function initUI() {
        const qContainer = document.getElementById('questions-container');
        QUESTIONS.forEach((q, index) => {
            const id = index + 1;
            qContainer.innerHTML += `
                <label class="checkbox-label">
                    <input type="checkbox" value="${id}" class="vote-checkbox">
                    <span class="custom-checkbox"></span>
                    <span>${q}</span>
                </label>
            `;
        });

        const cContainer = document.getElementById('charts-container');
        QUESTIONS.forEach((q, index) => {
            const id = index + 1;
            cContainer.innerHTML += `
                <div class="chart-row">
                    <div class="chart-label">
                        <span class="chart-label-text">${q}</span>
                        <span class="chart-label-value" id="pct-${id}">0%</span>
                    </div>
                    <div class="chart-track">
                        <div class="chart-bar" id="bar-${id}"></div>
                    </div>
                </div>
            `;
        });

        generateQRCode();
        restoreVoteState();
    }

    // --- ГЕНЕРАЦИЯ QR-КОДА ---
    function generateQRCode() {
        const qrElement = document.getElementById("qrcode");
        if (!qrElement) return;
        new QRCode(qrElement, {
            text: window.location.href,
            width: 110,
            height: 110,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    // --- УТИЛИТЫ ABACUS API ---
    // Получение значения счетчика (чистое чтение)
    async function getCount(key) {
        try {
            const res = await fetch(`${ABACUS_BASE}/get/${NAMESPACE}/${key}`, { cache: "no-store" });
            if (res.status === 404) return 0; // Счетчик еще не создан
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return parseInt(data.value, 10) || 0;
        } catch (e) {
            console.warn(`Ошибка получения ${key}:`, e);
            return 0;
        }
    }

    // Инкремент счетчика (атомарное увеличение на 1)
    async function hitCount(key) {
        const res = await fetch(`${ABACUS_BASE}/hit/${NAMESPACE}/${key}`);
        if (!res.ok) throw new Error(`HTTP ${res.status} при hit ${key}`);
        return await res.json();
    }

    // --- ЛОГИКА ГОЛОСОВАНИЯ ---
    async function submitVote() {
        if (localStorage.getItem(VOTE_STORAGE_KEY)) return;

        const checkboxes = document.querySelectorAll('.vote-checkbox:checked');
        const selectedCount = checkboxes.length;

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        showStatus('vote-status', 'Отправка данных...', '');

        try {
            const promises = [];

            // 1. Инкремент счетчика проголосовавших (+1 человек)
            promises.push(hitCount('voters'));

            // 2. Инкремент для каждого выбранного варианта
            checkboxes.forEach(cb => {
                const id = cb.value;
                promises.push(hitCount(`opt_${id}`));
            });

            await Promise.all(promises);

            localStorage.setItem(VOTE_STORAGE_KEY, 'true');
            localStorage.setItem(VOTE_STORAGE_KEY + '_score', selectedCount);
            
            if (selectedCount === 0) {
                showStatus('vote-status', '✅ Вы абсолютно здоровы! Уровень курочки: 0 из 6.', '');
            } else {
                showStatus('vote-status', `✅ Ваш уровень курочки: ${selectedCount} из 6. Спасибо!`, '');
            }
            btn.innerText = "Голос учтен";

        } catch (error) {
            console.error(error);
            showStatus('vote-status', 'Ошибка сети. Попробуйте еще раз.', 'error');
            btn.disabled = false;
        }
    }

    function restoreVoteState() {
        if (localStorage.getItem(VOTE_STORAGE_KEY)) {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Вы уже проголосовали";
            
            const score = localStorage.getItem(VOTE_STORAGE_KEY + '_score');
            if (score === '0') {
                showStatus('vote-status', `Ваш уровень курочки: 0 из 6.`, '');
            } else {
                showStatus('vote-status', `Ваш уровень курочки: ${score} из 6.`, '');
            }
            
            document.querySelectorAll('.vote-checkbox').forEach(cb => cb.disabled = true);
        }
    }

    // --- ЛОГИКА СБОРА РЕЗУЛЬТАТОВ ---
    async function fetchResults() {
        try {
            const votersPromise = getCount('voters');
            const optPromises = QUESTIONS.map((_, i) => getCount(`opt_${i + 1}`));

            const [voters, ...optCounts] = await Promise.all([votersPromise, ...optPromises]);

            // ВЫЧИСЛЯЕМ ОБЩИЙ БАЛЛ (сумма всех голосов за варианты)
            const totalScore = optCounts.reduce((sum, count) => sum + count, 0);

            updateUI(voters, totalScore, optCounts);
            showStatus('speaker-status', ''); 
        } catch (e) {
            showStatus('speaker-status', 'Ожидание данных...', 'error');
        }
    }

    function updateUI(voters, totalScore, optCounts) {
        document.getElementById('total-voters').innerText = voters;
        
        let avg = 0;
        if (voters > 0) {
            avg = (totalScore / voters).toFixed(1);
        }
        document.getElementById('avg-score').innerText = avg;

        optCounts.forEach((count, index) => {
            const id = index + 1;
            const pct = voters > 0 ? (count / voters) * 100 : 0;
            
            document.getElementById(`pct-${id}`).innerText = `${Math.round(pct)}% (${count})`;
            document.getElementById(`bar-${id}`).style.width = `${pct}%`;
        });
    }

    // --- УПРАВЛЕНИЕ РЕЖИМАМИ ---
    function toggleMode() {
        const voterScreen = document.getElementById('voter-screen');
        const speakerScreen = document.getElementById('speaker-screen');
        const voterToggle = document.getElementById('voter-toggle');

        if (currentMode === 'voter') {
            currentMode = 'speaker';
            voterScreen.classList.add('hidden');
            voterToggle.classList.add('hidden');
            speakerScreen.classList.remove('hidden');
            
            fetchResults();
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchResults, POLL_INTERVAL_MS);
        } else {
            currentMode = 'voter';
            speakerScreen.classList.add('hidden');
            voterScreen.classList.remove('hidden');
            voterToggle.classList.remove('hidden');
            
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }
    }

    function showStatus(elId, msg, type) {
        const el = document.getElementById(elId);
        el.innerText = msg;
        el.className = 'status-msg ' + (type || '');
    }

    // Запуск приложения
    initUI();
</script>
</body>
</html>
