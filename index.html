<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какая ты курочка?</title>
    <style>
        /* --- ШРИФТЫ --- */
        @font-face {
            font-family: 'CeraCondensed';
            src: url('CeraCondensedPro-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'CeraCondensed';
            src: url('CeraCondensedPro-Black.woff') format('woff');
            font-weight: 900;
            font-style: normal;
        }

        /* --- ОБЩИЕ СТИЛИ --- */
        :root {
            --bg: #ffffff;
            --accent: #e4002b;
            --text: #000000;
            --text-muted: #666666;
            --border: #e0e0e0;
        }

        body {
            font-family: 'CeraCondensed', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin-top: 40px;
        }

        h1, h2, h3 {
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            color: var(--accent);
            margin-top: 0;
            text-align: center;
        }

        h1 { font-size: 32px; text-transform: uppercase; margin-bottom: 30px; }
        h2 { font-size: 24px; margin-bottom: 20px; }
        
        .hidden { display: none !important; }

        /* --- КНОПКИ --- */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 20px;
        }

        .btn:hover:not(:disabled) { opacity: 0.9; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }

        .toggle-mode {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .toggle-mode:hover { color: var(--accent); }

        /* --- ЭКРАН СЛУШАТЕЛЯ --- */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, background-color 0.2s;
            font-size: 16px;
            line-height: 1.4;
        }

        .checkbox-label:hover { border-color: var(--accent); }

        .checkbox-label input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .custom-checkbox {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background-color: white;
            border: 2px solid var(--border);
            border-radius: 4px;
            position: relative;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .checkbox-label input:checked ~ .custom-checkbox {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .custom-checkbox::after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-label input:checked ~ .custom-checkbox::after {
            display: block;
        }
        
        .checkbox-label:has(input:checked) {
            border-color: var(--accent);
            background-color: #fdf2f4;
        }

        /* --- ЭКРАН СПИКЕРА (ГРАФИКИ) --- */
        .score-display {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border: 2px solid var(--text);
            border-radius: 12px;
        }

        .score-title { font-size: 16px; color: var(--text-muted); margin-bottom: 10px; }
        .score-value {
            font-family: 'CeraCondensed', sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: var(--accent);
            line-height: 1;
        }
        .score-max { font-size: 24px; color: var(--text); }

        .chart-row { margin-bottom: 25px; }
        
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        
        .chart-label-text { padding-right: 15px; }
        .chart-label-value { font-weight: 900; white-space: nowrap; }

        .chart-track {
            background-color: var(--border);
            width: 100%;
            height: 28px;
            border-radius: 4px;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            background-color: #000; /* Черный цвет по умолчанию */
        }

        /* Чередование цветов для графиков */
        .chart-row:nth-child(even) .chart-bar { background-color: var(--accent); }
        .chart-row:nth-child(odd) .chart-bar { background-color: #000; }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .status-msg.error { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ЭКРАН СЛУШАТЕЛЯ -->
    <div id="voter-screen">
        <h1>Какая ты курочка?</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">
            Отметь все утверждения, с которыми ты согласен(на)
        </p>

        <div class="question-list" id="questions-container">
            <!-- Вопросы генерируются через JS -->
        </div>

        <button class="btn" id="submit-btn" onclick="submitVote()">Узнать результат</button>
        <div id="vote-status" class="status-msg"></div>
    </div>

    <!-- ЭКРАН СПИКЕРА -->
    <div id="speaker-screen" class="hidden">
        <h2 style="text-align: center; margin-bottom: 30px;">Статистика выгорания</h2>
        
        <div class="score-display">
            <div class="score-title">Средний уровень "готовности курочки"</div>
            <div class="score-value"><span id="avg-score">0.0</span><span class="score-max"> / 6</span></div>
            <div class="score-title" style="margin-top: 15px; margin-bottom: 0;">Всего участников: <span id="total-voters" style="color: var(--text); font-weight: 900;">0</span></div>
        </div>

        <div id="charts-container">
            <!-- Графики генерируются через JS -->
        </div>

        <div id="speaker-status" class="status-msg"></div>
        
        <div class="toggle-mode" onclick="toggleMode()">Переключить в режим слушателя</div>
    </div>

    <!-- Экран Спикера (скрытая кнопка переключения для слушателя) -->
    <div id="voter-toggle" class="toggle-mode" onclick="toggleMode()">Режим докладчика</div>

</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const API_URL = "https://countapi.mileshilliard.com/api/v1";
    const BASE_KEY = "chicken_burnout_survey_2026"; // Уникальный ключ для этого опроса
    const VOTE_STORAGE_KEY = "poll_vote_chicken_" + BASE_KEY;
    const POLL_INTERVAL_MS = 3000;

    const QUESTIONS = [
        "Я просыпаюсь уже уставшим(ей), даже после выходных.",
        "Рабочие задачи вызывают больше раздражения или отвращения, чем раньше.",
        "Мне сложнее сосредоточиться, помнить детали и принимать решения.",
        "Я всё чаще думаю, что моя работа бессмысленна или я не справляюсь.",
        "После работы почти не остаётся сил на жизнь вне работы.",
        "Отдых помогает ненадолго или совсем не помогает."
    ];

    let pollInterval = null;
    let currentMode = "voter";

    // --- ИНИЦИАЛИЗАЦИЯ UI ---
    function initUI() {
        // Рендер чекбоксов
        const qContainer = document.getElementById('questions-container');
        QUESTIONS.forEach((q, index) => {
            const id = index + 1;
            qContainer.innerHTML += `
                <label class="checkbox-label">
                    <input type="checkbox" value="${id}" class="vote-checkbox">
                    <span class="custom-checkbox"></span>
                    <span>${q}</span>
                </label>
            `;
        });

        // Рендер пустых графиков
        const cContainer = document.getElementById('charts-container');
        QUESTIONS.forEach((q, index) => {
            const id = index + 1;
            cContainer.innerHTML += `
                <div class="chart-row">
                    <div class="chart-label">
                        <span class="chart-label-text">${q}</span>
                        <span class="chart-label-value" id="pct-${id}">0%</span>
                    </div>
                    <div class="chart-track">
                        <div class="chart-bar" id="bar-${id}"></div>
                    </div>
                </div>
            `;
        });

        restoreVoteState();
    }

    // --- УТИЛИТЫ API ---
    async function getCount(key) {
        try {
            const res = await fetch(`${API_URL}/get/${key}`, { cache: "no-store" });
            if (res.status === 404) return 0;
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return parseInt(data.value, 10) || 0;
        } catch (e) {
            console.warn(`Ошибка получения ${key}:`, e);
            return 0;
        }
    }

    async function ensureKey(key) {
        const val = await getCount(key);
        if (val === 0) {
            await fetch(`${API_URL}/set/${key}?value=0`);
        }
    }

    // --- ЛОГИКА ГОЛОСОВАНИЯ ---
    async function submitVote() {
        if (localStorage.getItem(VOTE_STORAGE_KEY)) return;

        const checkboxes = document.querySelectorAll('.vote-checkbox:checked');
        const selectedCount = checkboxes.length;

        if (selectedCount === 0) {
            showStatus('vote-status', 'Пожалуйста, выберите хотя бы один вариант.', 'error');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        showStatus('vote-status', 'Отправка данных...', '');

        try {
            const promises = [];

            // 1. Инкремент счетчика проголосовавших
            promises.push(fetch(`${API_URL}/hit/${BASE_KEY}_voters`));

            // 2. Обновление общего количества баллов (от 1 до 6)
            // Используем update с параметром amount
            promises.push(ensureKey(`${BASE_KEY}_score`).then(() => 
                fetch(`${API_URL}/update/${BASE_KEY}_score?amount=${selectedCount}`)
            ));

            // 3. Инкремент для каждого выбранного варианта
            checkboxes.forEach(cb => {
                const id = cb.value;
                promises.push(fetch(`${API_URL}/hit/${BASE_KEY}_opt_${id}`));
            });

            await Promise.all(promises);

            // Сохраняем факт голосования
            localStorage.setItem(VOTE_STORAGE_KEY, 'true');
            localStorage.setItem(VOTE_STORAGE_KEY + '_score', selectedCount);
            
            showStatus('vote-status', `✅ Ваш уровень курочки: ${selectedCount} из 6. Спасибо!`, '');
            btn.innerText = "Голос учтен";

        } catch (error) {
            console.error(error);
            showStatus('vote-status', 'Ошибка сети. Попробуйте еще раз.', 'error');
            btn.disabled = false;
        }
    }

    function restoreVoteState() {
        if (localStorage.getItem(VOTE_STORAGE_KEY)) {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Вы уже проголосовали";
            
            const score = localStorage.getItem(VOTE_STORAGE_KEY + '_score');
            showStatus('vote-status', `Ваш уровень курочки: ${score} из 6.`, '');
            
            document.querySelectorAll('.vote-checkbox').forEach(cb => cb.disabled = true);
        }
    }

    // --- ЛОГИКА СБОРА РЕЗУЛЬТАТОВ ---
    async function fetchResults() {
        try {
            // Запрашиваем все данные параллельно
            const votersPromise = getCount(`${BASE_KEY}_voters`);
            const scorePromise = getCount(`${BASE_KEY}_score`);
            const optPromises = QUESTIONS.map((_, i) => getCount(`${BASE_KEY}_opt_${i + 1}`));

            const [voters, totalScore, ...optCounts] = await Promise.all([votersPromise, scorePromise, ...optPromises]);

            updateUI(voters, totalScore, optCounts);
            showStatus('speaker-status', ''); // Очищаем ошибки
        } catch (e) {
            showStatus('speaker-status', 'Ожидание данных...', 'error');
        }
    }

    function updateUI(voters, totalScore, optCounts) {
        // 1. Обновляем общее число участников и средний балл
        document.getElementById('total-voters').innerText = voters;
        
        let avg = 0;
        if (voters > 0) {
            avg = (totalScore / voters).toFixed(1);
        }
        document.getElementById('avg-score').innerText = avg;

        // 2. Обновляем графики по каждому вопросу
        optCounts.forEach((count, index) => {
            const id = index + 1;
            const pct = voters > 0 ? (count / voters) * 100 : 0;
            
            document.getElementById(`pct-${id}`).innerText = `${Math.round(pct)}% (${count})`;
            document.getElementById(`bar-${id}`).style.width = `${pct}%`;
        });
    }

    // --- УПРАВЛЕНИЕ РЕЖИМАМИ ---
    function toggleMode() {
        const voterScreen = document.getElementById('voter-screen');
        const speakerScreen = document.getElementById('speaker-screen');
        const voterToggle = document.getElementById('voter-toggle');

        if (currentMode === 'voter') {
            currentMode = 'speaker';
            voterScreen.classList.add('hidden');
            voterToggle.classList.add('hidden');
            
            speakerScreen.classList.remove('hidden');
            
            fetchResults();
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchResults, POLL_INTERVAL_MS);
        } else {
            currentMode = 'voter';
            speakerScreen.classList.add('hidden');
            
            voterScreen.classList.remove('hidden');
            voterToggle.classList.remove('hidden');
            
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }
    }

    function showStatus(elId, msg, type) {
        const el = document.getElementById(elId);
        el.innerText = msg;
        el.className = 'status-msg ' + (type || '');
    }

    // Запуск
    initUI();

</script>
</body>
</html>
